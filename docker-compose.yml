# docker compose up --build
#   db -> migrate -> seed (small) -> api + worker -> tests (go test)
# The api, worker and db keep running after the tests finish.
services:
  db:
    image: postgres:16
    # Room for the test suite's per-test databases alongside the api and worker pools.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opps
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opps"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - postgres://postgres:postgres@db:5432/opps?sslmode=disable
    command: ["up"]
    depends_on:
      db:
        condition: service_healthy

  seed:
    image: postgres:16
    volumes:
      - ./seeds:/seeds:ro
    environment:
      PGPASSWORD: postgres
      SEED: ${SEED:-small}
    entrypoint: ["sh", "-c", "psql -h db -U postgres -d opps -v ON_ERROR_STOP=1 -q -f /seeds/$$SEED.sql"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      target: runtime
    image: bulk-move:latest
    command: ["api"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/opps?sslmode=disable
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      seed:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: runtime
    image: bulk-move:latest
    command: ["worker"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/opps?sslmode=disable
    depends_on:
      api:
        condition: service_healthy

  tests:
    build:
      context: .
      target: dev
    environment:
      TEST_DATABASE_URL: postgres://postgres:postgres@db:5432/postgres?sslmode=disable
    command: ["go", "test", "-count=1", "./..."]
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
